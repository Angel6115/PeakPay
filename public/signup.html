<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crear cuenta — PeekPay Early Access</title>
  <meta name="description" content="Únete a PeekPay con Early Access. Crea tu cuenta y obtén beneficios exclusivos para usuarios o creadores." />
  <link rel="canonical" href="https://peek-pay.com/signup.html" />
  <meta name="theme-color" content="#0732EF" />

  <!-- Favicons -->
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./favicon-32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

  <!-- Carga de env.js (en /public y producción) -->
  <script src="./env.js" defer></script>

  <style>
    :root{
      --bg: #FFFAF5;
      --text:#0f172a; --muted:#64748b; --card:#ffffff; --ring:#e2e8f0;
      --accent:#0732EF; --indigo:#0732EF; --purple:#5E17EB;
      --ok:#10b981; --err:#b91c1c; --warn:#9a3412;
    }
    *{ box-sizing:border-box; margin:0; padding:0 }
    body{
      font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .container{ max-width: 520px; width: 100%; }
    .card{
      background: var(--card); border: 1px solid var(--ring); border-radius: 26px;
      padding: 40px 32px; box-shadow: 0 24px 60px -18px rgba(4,10,63,0.4);
    }
    .logo-area{ text-align:center; margin-bottom: 16px; }
    .logo{ width: 140px; height: auto; display:block; margin: 0 auto 8px; filter: drop-shadow(0 6px 16px rgba(94,23,235,0.25)); }
    h1{ font-family:'Space Grotesk',system-ui,sans-serif; font-size: 26px; font-weight: 800; text-align:center; margin: 4px 0 6px; }
    .subtitle{ text-align:center; color:var(--muted); font-size: 15px; margin-bottom: 18px; }

    .price-box{
      border: 2px solid var(--ring); border-radius: 18px; padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #F4F1FF 100%);
      text-align:center; box-shadow: 0 10px 30px rgba(94,23,235,.1); margin-bottom: 18px;
    }
    .price{
      font-family:'Space Grotesk',system-ui,sans-serif;
      font-size: 48px; line-height: 1; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }
    .price-note{ font-size: 12px; color: var(--muted); }

    .form-group{ margin-top: 14px; }
    label{ display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    input, select{
      width: 100%; padding: 12px 14px; border: 2px solid var(--ring); border-radius: 14px; font-size: 15px; outline: none;
      transition: border-color .2s, box-shadow .2s; background:#fff; font-family:'Plus Jakarta Sans';
    }
    input:focus, select:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(7,50,239,0.12); }

    .btn{
      width: 100%; margin-top: 16px; padding: 15px 18px; border: 0; border-radius: 999px;
      background: linear-gradient(135deg, var(--indigo), var(--purple)); color: #fff;
      font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 14px 26px -10px rgba(7,50,239,.5);
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover{ transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(7,50,239,.55); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

    .error, .warn{
      display:none; padding:12px 14px; border-radius:12px; font-size:14px; margin: 10px 0 6px;
    }
    .error{ background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; }
    .warn{ background:#fff7ed; border:1px solid #fed7aa; color:var(--warn); }

    .benefits{ margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--ring); }
    .benefits h3{ font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .benefits ul{ list-style:none; padding:0; }
    .benefits li{ display:flex; align-items:flex-start; gap:8px; padding:8px 0; color:var(--muted); font-size:14px; }
    .benefits li::before{ content:"✓"; color:var(--ok); font-weight:900; }

    .back{ text-align:center; margin-top: 12px; }
    .back a{ color: var(--accent); text-decoration:none; font-weight:700; }
    .back a:hover{ text-decoration:underline; }

    .password-hint{ font-size: 12px; color: var(--muted); margin-top: 4px; }

    @media (max-width:640px){
      .card{ padding: 28px 22px; }
      .price{ font-size: 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-area">
        <img src="./assets/brand/peekpay-logo-h.svg" alt="PeekPay" class="logo">
        <h1>Crea tu cuenta</h1>
        <p class="subtitle">Gratis — únete a PeekPay en segundos</p>
      </div>

      <div class="price-box">
        <div id="price" class="price">Gratis</div>
        <div id="priceNote" class="price-note">10 Peak Credits de regalo al registrarte</div>
      </div>

      <div id="errorMsg" class="error" role="alert"></div>
      <div id="warnMsg" class="warn"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="role">Quiero ser</label>
          <select id="role" name="role" required>
            <option value="usuario">Usuario</option>
            <option value="creador">Creador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="tu@email.com"
                 autocomplete="email" required inputmode="email" spellcheck="false" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres"
                 autocomplete="new-password" required>
          <div class="password-hint">Mínimo 8 caracteres</div>
        </div>

        <button id="submitBtn" type="submit" class="btn">Crear cuenta gratis</button>
      </form>

      <div class="benefits">
        <h3>Lo que obtienes:</h3>
        <ul id="benefitsList"></ul>
      </div>

      <div class="back">
        <a href="./index.html">← Volver al inicio</a>
      </div>
    </div>
  </div>

  <!-- Cliente Supabase y lógica -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

    // ==== Config robusta (tolera orden de carga y distintos entornos) ====
    const E = (window.PP_ENV || {});
    const WARN = document.getElementById('warnMsg');

    if (!E.sb_url || !E.sb_anon) {
      WARN.style.display = 'block';
      WARN.textContent = 'Falta configuración de Supabase en env.js (sb_url / sb_anon).';
    }

    // ==== Inicializar Supabase (solo para el login post-registro) ====
    const supabase = (E.sb_url && E.sb_anon)
      ? createClient(E.sb_url, E.sb_anon, { auth: { persistSession: true, storageKey: 'pp-auth' } })
      : null;

    // --- Datos por rol (UI) ---
    const ROLE_DATA = {
      usuario: {
        cta: 'Crear cuenta gratis',
        benefits: [
          '10 Peak Credits de regalo',
          'Explora todos los creadores',
          'Suscríbete a tus creadores favoritos',
          'Comunidad VIP',
          'Early access a features'
        ]
      },
      creador: {
        cta: 'Crear cuenta de creador gratis',
        benefits: [
          'Tú pones el precio de tu suscripción mensual',
          'Recibes el 85% de cada suscripción y unlock',
          'Pagos semanales directos',
          'Dashboard de analytics',
          'Sin límite de uploads'
        ]
      }
    };

    // ==== DOM ====
    const roleSel = document.getElementById('role');
    const benefitsList = document.getElementById('benefitsList');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg){
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
    function hideError(){ errorMsg.style.display = 'none'; }

    function renderRole(role){
      const data = ROLE_DATA[role] || ROLE_DATA.usuario;
      submitBtn.textContent = data.cta;
      benefitsList.innerHTML = data.benefits.map(b => `<li>${b}</li>`).join('');
    }

    // Init UI
    renderRole(roleSel.value);
    roleSel.addEventListener('change', e => renderRole(e.target.value));

    // ==== Submit ====
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const roleHuman = roleSel.value; // 'usuario' | 'creador'

      // El registro de creadoras vive en creator-signup.html — ahí piden las
      // 2 fotos de muestra para la cola de revisión. Este formulario genérico
      // no las pide, así que si eligen "Creador" los mandamos allá en vez de
      // crear una cuenta que se salte la revisión.
      if (roleHuman === 'creador') {
        window.location.href = './creator-signup.html';
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email) return showError('Por favor ingresa tu email.');
      if (!emailRegex.test(email)) return showError('Email inválido.');
      if (!password || password.length < 8) return showError('La contraseña debe tener al menos 8 caracteres.');
      if (!supabase) return showError('Supabase no está configurado (revisa env.js).');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creando cuenta...';

      try {
        // 1) Crear + activar cuenta gratis (server-side, sin Stripe)
        const resp = await fetch('/api/auth/signup-free', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role: roleHuman })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          if (err.error === 'email_in_use') throw new Error('Este email ya está registrado. Usa otro o inicia sesión.');
          throw new Error(err.detail || err.error || 'Error al crear la cuenta.');
        }

        // 2) Iniciar sesión con las mismas credenciales
        submitBtn.textContent = 'Iniciando sesión...';
        const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
        if (signInError) throw signInError;

        // 3) Redirigir según el rol
        window.location.href = roleHuman === 'creador' ? './creator-dashboard.html' : './profile.html';

      } catch (err) {
        console.error('❌ Error signup:', err);
        showError(err.message || 'Error al procesar. Intenta nuevamente.');
        submitBtn.disabled = false;
        submitBtn.textContent = ROLE_DATA[roleHuman].cta;
      }
    });
  </script>
</body>
</html>
