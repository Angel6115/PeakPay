<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./platform-gate.js"></script>
  <title>PeekPay — Categorías</title>

  <link rel="icon" href="./favicon.ico">
  <link rel="preload" as="style" href="./styles.min.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="./styles.min.css"></noscript>
  <script defer data-domain="peak-pay.vercel.app" src="https://plausible.io/js/script.js"></script>

  <style>
    :root{ --bg:#ffffff; --text:#0b1020; --muted:#475569; --card:#f8fafc; --ring:#e2e8f0; --indigo:#4f46e5; --blue:#2563eb; --mint:#10b981; }
    body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif; margin:0 }
    .wrap{ max-width:1120px; margin:0 auto; padding:28px 16px 56px }

    /* Header con logo horizontal */
    .topbar{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:20px;
      padding-bottom:16px;
      border-bottom:2px solid var(--ring);
      flex-wrap:wrap;
    }
    .logo{
      height:auto;
      width:clamp(160px, 30%, 240px);
      filter: drop-shadow(0 4px 12px rgba(102,126,234,0.15));
    }
    .spacer{ flex:1 }
    .btn{
      border:0;
      background:linear-gradient(90deg, var(--indigo) 0%, var(--blue) 100%);
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      text-decoration:none;
      font-size:14px;
      box-shadow:0 6px 16px rgba(79,70,229,.25);
      font-weight:700;
      transition: all 0.3s;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow:0 8px 20px rgba(79,70,229,.35);
    }
    .btn.secondary{
      background:#fff;
      color:var(--indigo);
      border:1px solid var(--ring);
      box-shadow:none;
    }
    .btn.secondary:hover{
      background:rgba(102,126,234,0.05);
      border-color:var(--indigo);
    }

    .hero{ border:1px solid var(--ring); background:var(--card); border-radius:16px; padding:18px; margin:12px 0 18px; box-shadow:0 6px 14px rgba(79,70,229,.06) }
    .hero h2{ margin:0 0 6px; font-size:clamp(22px,4.3vw,28px); font-weight:900 }
    .hero p{ margin:0; color:var(--muted) }

    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px }
    @media (min-width:720px){ .grid{ grid-template-columns:repeat(3,1fr) } }
    @media (min-width:1024px){ .grid{ grid-template-columns:repeat(4,1fr) } }

    .card{ position:relative; overflow:hidden; border-radius:14px; border:1px solid var(--ring); background:linear-gradient(135deg,#eef2ff,#f8fafc); min-height:180px; display:flex; align-items:flex-end; text-decoration:none; color:inherit; box-shadow:0 6px 14px rgba(79,70,229,.06); transition: transform .08s ease, box-shadow .2s ease, border-color .2s ease; }
    .card:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(79,70,229,.16); border-color:#dbeafe }
    .thumb{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.92) saturate(1.06) }
    .overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.22) 40%, rgba(0,0,0,.55) 100%); pointer-events:none; }
    .info{ position:relative; z-index:1; width:100%; color:#fff; padding:12px 12px 13px; display:flex; flex-direction:column; gap:8px }
    .name{ font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.55) }

    .examples{ align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.2px; color:#fff; padding:6px 10px; border-radius:999px; background:rgba(9,14,30,.55); border:1px solid rgba(255,255,255,.35); backdrop-filter:saturate(140%) blur(6px); box-shadow:0 10px 20px rgba(0,0,0,.18), 0 0 0 1px rgba(255,255,255,.06) inset; text-shadow:0 1px 1px rgba(0,0,0,.35); }
    .dot{ width:8px; height:8px; border-radius:999px; background:conic-gradient(#00c853, #ffd600, #ff3d6e, #00c853); box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
    .badge{ position:absolute; top:10px; left:10px; z-index:2; font-size:11px; color:#fff; padding:4px 8px; border-radius:999px; background:linear-gradient(90deg, var(--mint) 0%, #34d399 100%); border:1px solid rgba(255,255,255,.35); box-shadow:0 8px 18px rgba(16,185,129,.25) }

    .skeleton{ border-radius:14px; min-height:180px; border:1px solid var(--ring); overflow:hidden; background: linear-gradient(90deg, #eef2f7 0%, #e6ebf2 50%, #f4f6fa 100%); background-size:200% 100%; animation: shimmer 1.1s linear infinite; }
    @keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .footer{ margin-top:24px; color:var(--muted); font-size:12px }
    .empty{ color:var(--muted); font-size:14px }
  </style>

  <link rel="canonical" href="https://peak-pay.vercel.app/categories.html">
  <meta name="description" content="Explora categorías y descubre creadores. Desbloquea peeks en packs de 3 o 9.">
  <meta property="og:site_name" content="PeekPay"><meta property="og:type" content="website">
  <meta property="og:title" content="PeekPay — Categorías">
  <meta property="og:description" content="Explora categorías y descubre creadores. Desbloquea peeks en packs de 3 o 9.">
  <meta property="og:url" content="https://peak-pay.vercel.app/categories.html">
  <meta property="og:image" content="https://peak-pay.vercel.app/peak1.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PeekPay — Categorías">
  <meta name="twitter:description" content="Explora categorías y descubre creadores. Desbloquea peeks en packs de 3 o 9.">
  <meta name="twitter:image" content="https://peak-pay.vercel.app/peak1.png">
  <link rel="preconnect" href="https://plausible.io">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <img src="./assets/brand/peekpay-logo-h.svg" alt="PeekPay" class="logo">
      <div class="spacer"></div>
      <a class="btn secondary" href="./profile.html">Inicio</a>
      <a class="btn" href="./creators.html">Creadores</a>
      <a class="btn" href="./wallet.html">Wallet</a>
    </div>

    <section class="hero">
      <h2>Categorías</h2>
      <p>Explora creadores por tema. En cada perfil podrás <b>desbloquear Peeks</b> (mosaicos) en packs de 3 o 9.</p>
    </section>

    <div id="grid" class="grid" aria-live="polite">
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>
    </div>
    <p id="empty" class="empty" hidden>Aún no hay categorías con creadores publicados.</p>

    <p class="footer">Fase 0 — SFW · Las tarjetas usan <i>placeholder</i> si aún no subiste un cover.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

    const supabase = createClient(window.PP_ENV.sb_url, window.PP_ENV.sb_anon);

    // Taxonomía fija (nombre + cover ilustrativo); el conteo por categoría
    // viene de creators.main_category, que se llena desde creator-signup.html.
    const TAXONOMY = [
      { slug:'arte', name:'Arte', cover:'./peak1.png' },
      { slug:'artistico', name:'Artístico', cover:'./peak1.png' },
      { slug:'cosplay', name:'Cosplay', cover:'./peak1.png' },
      { slug:'fitness', name:'Fitness', cover:'./peak1.png' },
      { slug:'lenceria', name:'Lencería', cover:'./peak1.png' }
    ];

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    async function loadCounts(){
      const { data, error } = await supabase
        .from('creators')
        .select('main_category')
        .eq('is_active', true)
        .eq('status', 'approved')
        .not('main_category', 'is', null);

      if (error) { console.warn('Error cargando categorías:', error); return {}; }

      const counts = {};
      for (const row of data || []) {
        counts[row.main_category] = (counts[row.main_category] || 0) + 1;
      }
      return counts;
    }

    async function render(){
      grid.innerHTML='';
      const counts = await loadCounts();
      const categories = TAXONOMY.map(cat => ({ ...cat, count: counts[cat.slug] || 0 }));

      if(!categories.length){ empty.hidden=false; return; }
      empty.hidden=true;

      for(const cat of categories){
        const a = document.createElement('a');
        a.href=`./creators.html?cat=${cat.slug}`;
        a.className='card';
        const countLabel = cat.count > 0
          ? `${cat.count} creador${cat.count>1?'es':''}`
          : 'Próximamente';
        a.innerHTML=`
          <img class="thumb" src="${cat.cover}" alt="${cat.name}" loading="lazy">
          <div class="overlay"></div>
          <div class="info">
            <div class="name">${cat.name}</div>
            <div class="examples"><span class="dot"></span>${countLabel}</div>
          </div>
        `;
        grid.appendChild(a);
      }
    }

    render();
  </script>
</body>
</html>
