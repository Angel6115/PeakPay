<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Iniciar sesión — PeekPay</title>
  
  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="./favicon.ico">
  
  <style>
    :root{
      --bg: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      --indigo:#4f46e5;
      --blue:#2563eb;
      --ring:#e2e8f0;
      --muted:#64748b;
      --err:#dc2626;
      --ok:#059669;
    }
    * {box-sizing:border-box; margin:0; padding:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;
      background:var(--bg);
      color:#0f172a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    
    .container{
      max-width:440px;
      width:100%;
    }
    
    /* Header con logo horizontal */
    .header{
      text-align:center;
      margin-bottom:32px;
    }
    .logo{
      height:auto;
      width:clamp(200px, 70%, 300px);
      filter: drop-shadow(0 4px 16px rgba(102,126,234,0.2));
      margin:0 auto 20px;
    }
    .header h1{
      font-size:28px;
      font-weight:900;
      margin-bottom:8px;
      background:linear-gradient(135deg, var(--indigo), var(--blue));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header p{
      color:var(--muted);
      font-size:15px;
    }
    
    /* Card */
    .card{
      background:white;
      border:1px solid var(--ring);
      border-radius:20px;
      padding:32px;
      box-shadow:0 10px 40px rgba(102,126,234,.12);
    }
    
    /* Form */
    .form-group{
      margin-bottom:16px;
    }
    label{
      display:block;
      font-size:13px;
      font-weight:600;
      color:#374151;
      margin-bottom:6px;
    }
    input{
      width:100%;
      padding:12px;
      border:1px solid var(--ring);
      border-radius:10px;
      font-size:14px;
      transition:all 0.3s;
    }
    input:focus{
      outline:none;
      border-color:var(--indigo);
      box-shadow:0 0 0 3px rgba(79,70,229,0.1);
    }
    
    /* Button */
    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:all 0.3s;
      background:linear-gradient(135deg, var(--indigo), var(--blue));
      color:white;
      box-shadow:0 4px 14px rgba(79,70,229,.3);
      margin-top:8px;
    }
    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(79,70,229,.4);
    }
    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
      transform:none;
    }
    
    /* Links */
    .links{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }
    .links a{
      color:var(--indigo);
      text-decoration:none;
      font-weight:600;
      transition:all 0.3s;
    }
    .links a:hover{
      text-decoration:underline;
    }
    .divider{
      margin:12px 0;
      color:var(--muted);
    }
    
    /* Message */
    .msg{
      margin-top:12px;
      padding:10px;
      border-radius:8px;
      font-size:13px;
      text-align:center;
      display:none;
    }
    .msg.show{
      display:block;
    }
    .msg.ok{
      background:rgba(5,150,105,0.1);
      border:1px solid rgba(5,150,105,0.3);
      color:var(--ok);
    }
    .msg.err{
      background:rgba(220,38,38,0.1);
      border:1px solid rgba(220,38,38,0.3);
      color:var(--err);
    }
    
    /* Back link */
    .back-link{
      text-align:center;
      margin-top:24px;
    }
    .back-link a{
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
      transition:all 0.3s;
    }
    .back-link a:hover{
      color:var(--indigo);
    }
    
    @media (max-width: 480px){
      .card{ padding: 24px 20px; }
      .logo{ width: clamp(180px, 80%, 240px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="./assets/brand/peekpay-logo-h.svg" alt="PeekPay" class="logo">
      <h1>Bienvenido de vuelta</h1>
      <p>Inicia sesión para continuar</p>
    </div>
    
    <!-- Card -->
    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="tu@email.com" 
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" class="btn" id="btnLogin">
          Iniciar sesión
        </button>
      </form>
      
      <div id="msg" class="msg"></div>
      
      <div class="links">
        <a href="./reset-password.html">¿Olvidaste tu contraseña?</a>
        <div class="divider">•</div>
        <span style="color:var(--muted)">¿No tienes cuenta?</span>
        <a href="./signup.html">Regístrate</a>
      </div>
    </div>
    
    <div class="back-link">
      <a href="./index.html">← Volver al inicio</a>
    </div>
  </div>

  <script type="module">
    function getSB(){
      if (window.__SB) return window.__SB;
      const E = window.PP_ENV || {};
      if (!E.sb_url || !E.sb_anon || !window.supabase?.createClient) return null;
      const auth = { 
        persistSession: true, 
        autoRefreshToken: true, 
        detectSessionInUrl: true, 
        storageKey: 'pp-auth' 
      };
      window.__SB = window.supabase.createClient(E.sb_url, E.sb_anon, { auth });
      window.sb = window.__SB;
      return window.__SB;
    }

    const $ = s => document.querySelector(s);
    const form = $('#loginForm');
    const email = $('#email');
    const password = $('#password');
    const btnLogin = $('#btnLogin');
    const msg = $('#msg');

    function setMsg(text, isOk){
      msg.textContent = text;
      msg.className = 'msg show ' + (isOk ? 'ok' : 'err');
    }

    function clearMsg(){
      msg.className = 'msg';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      
      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (!emailValue || !passwordValue) {
        setMsg('Por favor completa todos los campos');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Iniciando sesión...';
      clearMsg();

      try {
        const sb = getSB();
        if (!sb) {
          throw new Error('Error de configuración');
        }

        const { data, error } = await sb.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });

        if (error) throw error;

        if (data.user) {
          setMsg('✓ ¡Bienvenido! Redirigiendo...', true);
          
          // Obtener parámetro de redirección
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next') || './profile.html';
          
          setTimeout(() => {
            window.location.href = next;
          }, 800);
        }

      } catch (error) {
        console.error('Login error:', error);
        
        let errorMsg = 'Error al iniciar sesión';
        if (error.message.includes('Invalid login credentials')) {
          errorMsg = 'Email o contraseña incorrectos';
        } else if (error.message.includes('Email not confirmed')) {
          errorMsg = 'Por favor confirma tu email primero';
        } else {
          errorMsg = error.message || errorMsg;
        }
        
        setMsg(errorMsg);
        btnLogin.disabled = false;
        btnLogin.textContent = 'Iniciar sesión';
      }
    };

    // Auto-login check
    (async function checkSession(){
      const sb = getSB();
      if (!sb) return;

      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          // Ya hay sesión activa
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next') || './profile.html';
          window.location.href = next;
        }
      } catch (err) {
        console.warn('Session check error:', err);
      }
    })();
  </script>
</body>
</html>
