<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <title>Iniciar sesión — PeekPay</title>
  <meta name="description" content="Accede a tu cuenta PeekPay para continuar donde lo dejaste." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="canonical" href="https://peek-pay.com/login.html" />
  <meta name="theme-color" content="#0732EF" />

  <!-- Favicons (rutas relativas para funcionar en local y prod) -->
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./favicon-32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

  <!-- Env + Supabase -->
  <script>
    // Bandera útil para condicionar comportamientos si quisieras
    window.__IS_LOCAL__ = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  </script>
  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg: #FFFAF5;
      --hero-grad: linear-gradient(120deg, #0732EF 0%, #5E17EB 55%, #FF66C4 100%);
      --indigo:#0732EF;
      --blue:#5E17EB;
      --ring:#e2e8f0;
      --muted:#64748b;
      --err:#dc2626;
      --ok:#059669;
      --text:#0f172a;
    }
    * {box-sizing:border-box; margin:0; padding:0}
    body{
      font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .container{ max-width:440px; width:100%; }

    .header{
      text-align:center; margin-bottom:24px;
      background:var(--hero-grad); border-radius:24px;
      padding:32px 24px; box-shadow:0 16px 32px -14px rgba(7,50,239,.35);
    }
    .logo{
      height:auto; width:clamp(180px, 60%, 260px);
      filter: drop-shadow(0 4px 16px rgba(4,10,63,0.25));
      margin:0 auto 16px; display:block;
    }
    .header h1{
      font-family:'Space Grotesk',system-ui,sans-serif;
      font-size:24px; font-weight:800; margin-bottom:6px; color:#fff;
    }
    .header p{ color:rgba(255,255,255,.85); font-size:14px; }

    .card{
      background:white; border:1px solid var(--ring); border-radius:26px;
      padding:32px; box-shadow:0 24px 50px -18px rgba(4,10,63,.4);
    }

    .form-group{ margin-bottom:16px; }
    label{
      display:block; font-size:13px; font-weight:700; color:#374151; margin-bottom:6px;
    }
    input{
      width:100%; padding:12px 14px; border:2px solid var(--ring); border-radius:14px; font-size:14px; transition:all 0.3s;
      background:#fff; font-family:'Plus Jakarta Sans';
    }
    input:focus{ outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(7,50,239,0.12); }

    .btn{
      width:100%; padding:15px; border:none; border-radius:999px; font-size:15px; font-weight:800; cursor:pointer; transition:all 0.3s;
      background:linear-gradient(135deg, var(--indigo), var(--blue)); color:white; box-shadow:0 14px 26px -10px rgba(7,50,239,.5); margin-top:8px;
    }
    .btn:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -8px rgba(7,50,239,.55); }
    .btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

    .links{ text-align:center; margin-top:20px; font-size:14px; }
    .links a{ color:var(--blue); text-decoration:none; font-weight:700; transition:all 0.3s; }
    .links a:hover{ color:var(--indigo); text-decoration:underline; }
    .divider{ margin:12px 0; color:var(--muted); }

    .msg{ margin-top:12px; padding:10px; border-radius:8px; font-size:13px; text-align:center; display:none; }
    .msg.show{ display:block; }
    .msg.ok{ background:rgba(5,150,105,0.1); border:1px solid rgba(5,150,105,0.3); color:var(--ok); }
    .msg.err{ background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); color:var(--err); }

    .back-link{ text-align:center; margin-top:24px; }
    .back-link a{ color:var(--muted); text-decoration:none; font-size:13px; transition:all 0.3s; }
    .back-link a:hover{ color:var(--indigo); }

    @media (max-width: 480px){
      .card{ padding: 24px 20px; }
      .logo{ width: clamp(180px, 80%, 240px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <!-- Ruta relativa para evitar 404 en local -->
      <img src="./assets/brand/peekpay-logo-h-white.svg" alt="PeekPay" class="logo" />
      <h1>Bienvenido de vuelta</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <div class="card" role="region" aria-label="Formulario de inicio de sesión">
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            required
            inputmode="email"
            autocomplete="email"
            spellcheck="false"
            autocapitalize="none"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn" id="btnLogin">Iniciar sesión</button>
      </form>

      <div id="msg" class="msg" role="alert" aria-live="polite"></div>

      <div class="links">
        <!-- Corrijo el 404: en tu repo existe public/reset.html -->
        <a href="./reset.html">¿Olvidaste tu contraseña?</a>
        <div class="divider">•</div>
        <span style="color:var(--muted)">¿No tienes cuenta?</span>
        <a href="./signup.html">Regístrate</a>
      </div>
    </div>

    <div class="back-link">
      <a href="./index.html">← Volver al inicio</a>
    </div>
  </div>

  <script type="module">
    // Helper Supabase con guardas
    function getSB(){
      if (window.__SB) return window.__SB;
      const E = window.PP_ENV || {};
      if (!E.sb_url || !E.sb_anon || !window.supabase?.createClient) return null;
      const auth = {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: 'pp-auth'
      };
      window.__SB = window.supabase.createClient(E.sb_url, E.sb_anon, { auth });
      window.sb = window.__SB; // atajo útil en consola
      return window.__SB;
    }

    const $ = s => document.querySelector(s);
    const form = $('#loginForm');
    const email = $('#email');
    const password = $('#password');
    const btnLogin = $('#btnLogin');
    const msg = $('#msg');

    function setMsg(text, isOk){
      msg.textContent = text;
      msg.className = 'msg show ' + (isOk ? 'ok' : 'err');
    }
    function clearMsg(){ msg.className = 'msg'; }

    // Si falta env en local, aviso amable (sin romper)
    (function warnEnv(){
      if (!window.PP_ENV || !PP_ENV.sb_url || !PP_ENV.sb_anon){
        console.warn('[login] PP_ENV no disponible (¿env.js sin configurar?). El login no funcionará en local hasta proveer credenciales.');
      }
    })();

    form.onsubmit = async (e) => {
      e.preventDefault();

      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (!emailValue || !passwordValue) {
        setMsg('Por favor completa todos los campos');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Iniciando sesión…';
      clearMsg();

      try {
        const sb = getSB();
        if (!sb) throw new Error('Configuración ausente. Revisa env.js');

        // 1) Login
        const { data, error } = await sb.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });
        if (error) throw error;

        if (data.user) {
          setMsg('✓ Verificando perfil…', true);

          // 2) Verificar rol
          const { data: profile, error: profileError } = await sb
            .from('profiles')
            .select('role, is_creator, is_admin')
            .eq('id', data.user.id)
            .single();

          if (profileError) console.warn('Profile error:', profileError);

          // 2.5) Si la plataforma no está lanzada y esta cuenta no es admin,
          // ni el rol ni next= importan — va directo a la sala de espera.
          if (!profile?.is_admin) {
            try {
              const statusResp = await fetch('/api/platform-status', { cache: 'no-store' });
              const statusJson = await statusResp.json();
              if (!statusJson.launched) {
                setMsg('✓ Registrado. Redirigiendo…', true);
                setTimeout(() => { window.location.href = './waiting-room.html'; }, 600);
                return;
              }
            } catch (_) { /* si falla el check, seguimos el flujo normal */ }
          }

          // 3) Destino por rol (admin siempre gana, sin importar next=)
          let destination = './profile.html';
          if (profile && profile.is_admin) {
            destination = './admin.html';
            setMsg('✓ ¡Bienvenida! Redirigiendo al panel de admin…', true);
          } else if (profile && (profile.role === 'creator' || profile.is_creator === true)) {
            destination = './creator-dashboard.html';
            setMsg('✓ ¡Bienvenido creador! Redirigiendo…', true);
          } else {
            setMsg('✓ ¡Bienvenido! Redirigiendo…', true);
          }

          // 4) Permitir ?next= sólo si NO es creador ni admin
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          if (next && (!profile || (profile.role !== 'creator' && !profile.is_creator && !profile.is_admin))) {
            destination = next;
          }

          setTimeout(() => { window.location.href = destination; }, 800);
        }

      } catch (error) {
        console.error('Login error:', error);
        let errorMsg = 'Error al iniciar sesión';
        const m = (error && error.message) ? error.message : '';
        if (m.includes('Invalid login credentials')) errorMsg = 'Email o contraseña incorrectos';
        else if (m.includes('Email not confirmed')) errorMsg = 'Por favor confirma tu email primero';
        else if (m) errorMsg = m;

        setMsg(errorMsg);
        btnLogin.disabled = false;
        btnLogin.textContent = 'Iniciar sesión';
      }
    };

    // Si ya hay sesión, redirige según rol
    (async function checkSession(){
      const sb = getSB();
      if (!sb) return;
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return;

        const { data: profile } = await sb
          .from('profiles')
          .select('role, is_creator, is_admin')
          .eq('id', session.user.id)
          .single();

        if (!profile?.is_admin) {
          try {
            const statusResp = await fetch('/api/platform-status', { cache: 'no-store' });
            const statusJson = await statusResp.json();
            if (!statusJson.launched) { window.location.href = './waiting-room.html'; return; }
          } catch (_) { /* si falla el check, seguimos el flujo normal */ }
        }

        let destination = './profile.html';
        if (profile && profile.is_admin) {
          destination = './admin.html';
        } else if (profile && (profile.role === 'creator' || profile.is_creator)) {
          destination = './creator-dashboard.html';
        } else {
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          if (next) destination = next;
        }
        window.location.href = destination;
      } catch (err) {
        console.warn('Session check error:', err);
      }
    })();
  </script>
</body>
</html>
