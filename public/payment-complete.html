<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pago completado — PeekPay</title>
<!-- ENV + Supabase (añadidos) -->
<script src="./env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:linear-gradient(135deg,#eef2ff 0%,#e0e7ff 100%);
  --text:#0f172a; --muted:#64748b; --card:#fff; --ring:#e2e8f0;
  --accent:#667eea; --purple:#764ba2; --success:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Ubuntu,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.container{ max-width:560px; width:100%; text-align:center }
.card{
  background:var(--card); border:1px solid var(--ring); border-radius:24px;
  padding:44px 34px; box-shadow:0 20px 60px rgba(102,126,234,.12)
}
.success-icon{
  width:80px; height:80px; margin:0 auto 18px;
  background:linear-gradient(135deg,var(--success),#059669);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:48px; color:#fff; animation:scaleIn .5s
}
@keyframes scaleIn{from{transform:scale(0)}to{transform:scale(1)}}
h1{ font-size:28px; font-weight:900; margin-bottom:10px }
.subtitle{ color:var(--muted); font-size:16px; margin-bottom:20px; line-height:1.6 }
.highlight-box{
  background:linear-gradient(135deg,rgba(102,126,234,.08),rgba(118,75,162,.08));
  border:2px solid var(--accent); border-radius:16px; padding:18px; margin-bottom:22px
}
.highlight-box h2{ font-size:18px; margin-bottom:12px; font-weight:800 }
.benefits{ text-align:left; display:inline-block }
.benefits ul{ list-style:none; padding:0; margin:0 }
.benefits li{
  padding:8px 0; font-size:14px; color:var(--muted);
  display:flex; align-items:center; gap:10px
}
.benefits li::before{ content:"✓"; color:var(--success); font-weight:900; font-size:18px }
.btn{
  display:inline-block; padding:14px 28px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:800;
  text-decoration:none; cursor:pointer; transition:all .3s;
  box-shadow:0 8px 20px rgba(102,126,234,.3)
}
.btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(102,126,234,.4) }
.btn.secondary{ background:#fff; color:var(--accent); border:1px solid var(--ring); box-shadow:none }
.note{
  margin-top:16px; padding:12px; background:rgba(16,185,129,.08);
  border:1px solid rgba(16,185,129,.25); border-radius:10px;
  font-size:13px; color:#065f46; line-height:1.6
}
.loading{ margin-top:14px; color:var(--muted); font-size:14px }
.kbd{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
      background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; padding:2px 6px }
@media(max-width:640px){ .card{ padding:34px 22px } h1{ font-size:24px } }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="success-icon">✓</div>
      <h1>¡Pago completado!</h1>
      <p id="subtitle" class="subtitle">Procesando tu acceso…</p>

      <div class="highlight-box">
        <h2>Tu acceso incluye:</h2>
        <div class="benefits">
          <ul>
            <li>1,000 Peak Credits</li>
            <li>Acceso de por vida</li>
            <li>Badge “Founder”</li>
            <li>Comunidad VIP</li>
            <li>Early Access</li>
          </ul>
        </div>
      </div>

      <div id="actions" style="display:none">
        <a id="primary" class="btn" href="#">Continuar</a>
        <div class="note" id="note"></div>
        <div class="loading" id="delay">Redirigiendo en <span id="secs">2</span>…</div>
      </div>

      <div id="fallback" class="loading">Configurando…</div>
    </div>
  </div>

  <script>
    (function () {
      const p   = new URLSearchParams(location.search);
      const t   = (p.get('t') || 'user').toLowerCase(); // creator | user
      const e   = (p.get('e') || '').trim();
      const sid = (p.get('session_id') || '').trim();

      // Destinos (relativos a /public)
      const creatorTarget = `./creator-welcome.html?from=stripe&e=${encodeURIComponent(e)}&session_id=${encodeURIComponent(sid)}`;
      const userTarget    = `./welcome.html?from=stripe&e=${encodeURIComponent(e)}&session_id=${encodeURIComponent(sid)}`;
      const target        = t === 'creator' ? creatorTarget : userTarget;

      const subtitleEl = document.getElementById('subtitle');
      const actions    = document.getElementById('actions');
      const fallback   = document.getElementById('fallback');
      const primary    = document.getElementById('primary');
      const note       = document.getElementById('note');
      const secsEl     = document.getElementById('secs');
      const delayEl    = document.getElementById('delay');

      // Copy por tipo
      if (t === 'creator') {
        subtitleEl.textContent = '¡Bienvenido, Creador! Completa tu registro para el Soft Launch.';
        primary.textContent = 'Completar registro de creador';
        note.innerHTML = e
          ? `Seguiremos con el email <span class="kbd">${e}</span>.`
          : 'Si no ves tu email, lo podrás ingresar en el siguiente paso.';
      } else {
        subtitleEl.textContent = 'Tu acceso está listo. Te llevaremos a tu panel.';
        primary.textContent = 'Ir a mi panel';
        note.textContent = e
          ? `Usaremos <${e}> para tu cuenta.`
          : 'Podrás ingresar tu email en el siguiente paso.';
      }
      primary.href = target;

      // Mostrar UI
      fallback.style.display = 'none';
      actions.style.display = 'block';

      // --- SUPABASE UPSERT: guarda "reserved" (silencioso) ---
      (async function saveReserved(){
        try{
          if (!window.__ENV__?.supabaseUrl || !window.__ENV__?.supabaseAnonKey) return;
          const supabase = window.supabase.createClient(window.__ENV__.supabaseUrl, window.__ENV__.supabaseAnonKey);

          // Evita upserts vacíos
          const email = e || null;
          const type  = (t === 'creator' ? 'creator' : 'user');

          const payload = {
            email,
            type,
            stripe_session_id: sid || null,
            status: 'reserved'
          };

          // upsert por (email,type) para evitar duplicados si refrescan
          await supabase
            .from('prelaunch_signups')
            .upsert(payload, { onConflict: 'email,type' });

        } catch (err) {
          // no romper UX
          console.warn('Supabase upsert (reserved) falló:', err?.message || err);
        }
      })();

      // Auto-redirect (2s)
      let n = 2;
      const tick = setInterval(() => {
        n -= 1;
        secsEl.textContent = String(Math.max(n,0));
        if (n <= 0) {
          clearInterval(tick);
          location.href = target;
        }
      }, 1000);

      // Si llegaron sin params, quita redirección automática
      if (!p.get('t') && !p.get('session_id')) {
        delayEl.style.display = 'none';
        note.textContent = 'No encontramos los datos de la compra. Puedes continuar manualmente.';
      }
    })();
  </script>
</body>
</html>
