<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Completa tu perfil — PeekPay</title>

  <script src="./env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="./favicon.ico">
  
  <style>
    :root{
      --bg: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      --indigo:#4f46e5;
      --blue:#2563eb;
      --ring:#e2e8f0;
      --muted:#64748b;
    }
    * {box-sizing:border-box; margin:0; padding:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;
      background:var(--bg);
      color:#0f172a;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    
    .container{
      max-width:520px;
      width:100%;
    }
    
    /* Header con logo horizontal */
    .header{
      text-align:center;
      margin-bottom:32px;
    }
    .logo{
      height:auto;
      width:clamp(200px, 60%, 280px);
      filter: drop-shadow(0 4px 16px rgba(102,126,234,0.2));
      margin:0 auto 20px;
    }
    .header h1{
      font-size:28px;
      font-weight:900;
      margin-bottom:8px;
      background:linear-gradient(135deg, var(--indigo), var(--blue));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header p{
      color:var(--muted);
      font-size:15px;
    }
    
    /* Progress bar */
    .progress-bar{
      display:flex;
      gap:8px;
      margin-bottom:28px;
    }
    .progress-step{
      flex:1;
      height:4px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
    }
    .progress-step.active{
      background:linear-gradient(90deg, var(--indigo), var(--blue));
    }
    
    /* Card */
    .card{
      background:white;
      border:1px solid var(--ring);
      border-radius:20px;
      padding:32px;
      box-shadow:0 10px 40px rgba(102,126,234,.12);
    }
    
    .step-title{
      font-size:20px;
      font-weight:800;
      margin-bottom:6px;
    }
    .step-subtitle{
      color:var(--muted);
      font-size:14px;
      margin-bottom:24px;
    }
    
    /* Avatar upload */
    .avatar-section{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      margin-bottom:24px;
    }
    .avatar-preview{
      width:120px;
      height:120px;
      border-radius:50%;
      border:3px solid var(--ring);
      object-fit:cover;
      background:#f8fafc;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
    }
    .avatar-btn{
      padding:10px 20px;
      background:white;
      border:1px solid var(--ring);
      border-radius:10px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:all 0.3s;
    }
    .avatar-btn:hover{
      border-color:var(--indigo);
      background:rgba(79,70,229,0.05);
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }
    
    /* Form */
    .form-group{
      margin-bottom:16px;
    }
    label{
      display:block;
      font-size:13px;
      font-weight:600;
      color:#374151;
      margin-bottom:6px;
    }
    input{
      width:100%;
      padding:12px;
      border:1px solid var(--ring);
      border-radius:10px;
      font-size:14px;
      transition:all 0.3s;
    }
    input:focus{
      outline:none;
      border-color:var(--indigo);
      box-shadow:0 0 0 3px rgba(79,70,229,0.1);
    }
    
    /* Buttons */
    .actions{
      display:flex;
      gap:12px;
      margin-top:24px;
    }
    .btn{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      transition:all 0.3s;
    }
    .btn-primary{
      background:linear-gradient(135deg, var(--indigo), var(--blue));
      color:white;
      box-shadow:0 4px 14px rgba(79,70,229,.3);
    }
    .btn-primary:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(79,70,229,.4);
    }
    .btn-secondary{
      background:white;
      color:#374151;
      border:2px solid var(--ring);
    }
    .btn-secondary:hover{
      border-color:var(--indigo);
      background:rgba(79,70,229,0.05);
    }
    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }
    
    .msg{
      margin-top:12px;
      font-size:13px;
      text-align:center;
    }
    .msg.ok{color:#059669}
    .msg.err{color:#dc2626}
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="./assets/brand/peekpay-logo-h.svg" alt="PeekPay" class="logo">
      <h1>Completa tu perfil</h1>
      <p>Solo te tomará un minuto configurar tu cuenta</p>
    </div>
    
    <!-- Progress -->
    <div class="progress-bar">
      <div class="progress-step active"></div>
      <div class="progress-step"></div>
    </div>
    
    <!-- Card -->
    <div class="card">
      <h2 class="step-title">Agrega tu foto</h2>
      <p class="step-subtitle">Sube una imagen de perfil (opcional)</p>
      
      <!-- Avatar -->
      <div class="avatar-section">
        <img id="avatarPreview" class="avatar-preview" src="./peak1.png" alt="Avatar">
        <input id="fileInput" type="file" accept="image/*" style="display:none">
        <button id="btnUpload" class="avatar-btn">Subir imagen</button>
        <p class="hint">JPG, PNG o GIF: Máx 5MB</p>
      </div>
      
      <!-- Actions -->
      <div class="actions">
        <button id="btnSkip" class="btn btn-secondary">Atrás</button>
        <button id="btnContinue" class="btn btn-primary">Continuar</button>
      </div>
      
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script type="module">
    function getSB(){
      if (window.__SB) return window.__SB;
      const E = window.PP_ENV || {};
      if (!E.sb_url || !E.sb_anon || !window.supabase?.createClient) return null;
      const auth = { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'pp-auth' };
      window.__SB = window.supabase.createClient(E.sb_url, E.sb_anon, { auth });
      window.sb = window.__SB;
      return window.__SB;
    }

    const $ = s => document.querySelector(s);
    const avatarPreview = $('#avatarPreview');
    const fileInput = $('#fileInput');
    const btnUpload = $('#btnUpload');
    const btnSkip = $('#btnSkip');
    const btnContinue = $('#btnContinue');
    const msg = $('#msg');
    
    let uploadedUrl = null;
    let currentUser = null;

    function setMsg(text, isOk){
      msg.textContent = text || '';
      msg.className = 'msg ' + (isOk ? 'ok' : 'err');
    }

    async function init(){
      const sb = getSB();
      if (!sb){
        setMsg('Error de configuración');
        return;
      }

      const { data: { session } } = await sb.auth.getSession();
      if (!session){
        location.href = './login.html';
        return;
      }
      
      currentUser = session.user;

      // Upload button
      btnUpload.onclick = () => fileInput.click();
      
      fileInput.onchange = async () => {
        if (!fileInput.files || !fileInput.files[0]) return;
        
        try {
          setMsg('Subiendo imagen…');
          btnUpload.disabled = true;
          
          const file = fileInput.files[0];
          if (file.size > 5 * 1024 * 1024){
            throw new Error('La imagen debe ser menor a 5MB');
          }
          
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const key = `u/${currentUser.id}/${Date.now()}.${ext}`;
          
          const { error } = await sb.storage.from('avatars').upload(key, file, { upsert: false });
          if (error) throw error;
          
          const { data } = sb.storage.from('avatars').getPublicUrl(key);
          if (!data?.publicUrl) throw new Error('No se obtuvo URL pública');
          
          uploadedUrl = data.publicUrl;
          avatarPreview.src = uploadedUrl;
          setMsg('Imagen subida ✓', true);
        } catch(e) {
          setMsg(e.message || 'Error al subir imagen');
        } finally {
          btnUpload.disabled = false;
          fileInput.value = '';
        }
      };

      // Skip button
      btnSkip.onclick = () => {
        location.href = './profile.html';
      };

      // Continue button
      btnContinue.onclick = async () => {
        try {
          setMsg('Guardando…');
          btnContinue.disabled = true;
          
          if (uploadedUrl) {
            const { error } = await sb.auth.updateUser({
              data: { avatar_url: uploadedUrl }
            });
            if (error) throw error;
          }
          
          setMsg('¡Listo! Redirigiendo…', true);
          setTimeout(() => {
            location.href = './profile.html';
          }, 800);
        } catch(e) {
          setMsg(e.message || 'Error al guardar');
          btnContinue.disabled = false;
        }
      };
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
